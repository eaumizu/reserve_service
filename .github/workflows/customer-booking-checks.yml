name: Customer booking checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
      NEXT_PUBLIC_DEFAULT_STORE_ID: 11111111-1111-1111-1111-111111111111
      SUPABASE_SERVICE_ROLE_KEY: test-server-key
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: PostgreSQL migrations and customer booking operations
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: booking_test
          PGUSER: postgres
          PGPASSWORD: local-test-password
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role;
          create schema auth;
          create function auth.jwt() returns jsonb language sql stable as $$ select '{}'::jsonb $$;
          SQL
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0011_customer_booking_access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0012_store_line_settings.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0013_customer_line_links.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0014_line_booking_notifications.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0015_line_reservation_events.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0016_customer_staff_reschedule.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0017_booking_reminders.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0018_store_email_settings.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
          psql -v ON_ERROR_STOP=1 -f tests/customer-booking-db.sql
          psql -v ON_ERROR_STOP=1 -f tests/line-reservation-events-db.sql
          psql -v ON_ERROR_STOP=1 -f tests/booking-reminders-db.sql
          psql -v ON_ERROR_STOP=1 -f tests/store-email-db.sql
      - name: Browser checks
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/customer-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/reservation > /dev/null; then break; fi
            sleep 1
          done
          node tests/customer-booking-ui.cjs
          node tests/reminder-ui.cjs

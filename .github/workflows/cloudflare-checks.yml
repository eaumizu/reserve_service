name: Cloudflare Workers checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
      NEXT_PUBLIC_DEFAULT_STORE_ID: 11111111-1111-1111-1111-111111111111
      SUPABASE_SERVICE_ROLE_KEY: test-server-key
      WRANGLER_SEND_METRICS: false
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:build
      - name: Validate production bundle and reminder worker without uploading
        run: |
          pnpm exec wrangler deploy --env production --dry-run --outdir /tmp/production-bundle
          pnpm exec wrangler deploy --config cloudflare/wrangler.reminders.jsonc --dry-run --outdir /tmp/reminder-bundle
      - name: Smoke checks in the local Workers runtime
        run: |
          pnpm cf:preview > /tmp/cloudflare-preview.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true' EXIT
          ready=false
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3013/reservation > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/cloudflare-preview.log; exit 1; fi
          pnpm cf:smoke
      - name: Verify Node and Workers credential encryption compatibility
        run: |
          pnpm exec wrangler dev --config tests/fixtures/wrangler.crypto.jsonc --port 3014 > /tmp/cloudflare-crypto.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true' EXIT
          ready=false
          for attempt in $(seq 1 40); do
            if curl --silent http://127.0.0.1:3014 > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/cloudflare-crypto.log; exit 1; fi
          node tests/cloudflare-crypto-smoke.cjs
